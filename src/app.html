<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- TODO check if type & size are ok image/x-icon & 16x16 32x32? -->
		<link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- TODO needed? <link rel="apple-touch-icon" href="/apple-touch-icon.png"> -->
		<meta name="msapplication-TileColor" content="#0e1626" />
		<meta name="theme-color" content="#0e1626" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-gray-600 antialiased dark:bg-gray-900 dark:text-gray-400"
	>
		<div id="svelte-content">%sveltekit.body%</div>
	</body>

	<script>
		if (global === undefined) {
			var global = window;
		}
	</script>
</html>
