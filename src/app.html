<!doctype html>

<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<style>
			html {
				background: #fff4e0;
			}
		</style>

		<!-- TODO check if type & size are ok image/x-icon & 16x16 32x32? -->
		<link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- TODO needed? <link rel="apple-touch-icon" href="/apple-touch-icon.png"> -->
		<meta name="msapplication-TileColor" content="#ff5a36" />
		<meta name="theme-color" content="#ff5a36" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="antialiased">
		<div id="svelte-content">%sveltekit.body%</div>
	</body>

	<script>
		if (global === undefined) {
			var global = window;
		}
	</script>
</html>
